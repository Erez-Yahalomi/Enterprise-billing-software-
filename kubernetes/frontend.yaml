apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: billing
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: billing-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - {name: VITE_BACKEND_URL, value: "http://backend:8000"}
          readinessProbe:
            httpGet: {path: /, port: 5173}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 5173}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: billing
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30173
