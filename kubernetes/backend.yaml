apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: billing
spec:
  # One replica: the lake PVC is ReadWriteOnce and the demo seed isn't built for concurrency.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      enableServiceLinks: false
      initContainers:
        # Wait for dependencies the app needs at startup (migrations need Postgres).
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: backend
          image: billing-backend:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: billing-config}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: billing-secrets, key: DATABASE_URL}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: billing-secrets, key: JWT_SECRET}}
            - name: GEMINI_API_KEY
              # optional: the key isn't in the manifest's Secret, so a fresh cluster has none
              # until set-gemini-key.ps1 runs (the assistant falls back to rules/mock meanwhile).
              valueFrom: {secretKeyRef: {name: billing-secrets, key: GEMINI_API_KEY, optional: true}}
          startupProbe:          # allows time for `alembic upgrade head` on first boot
            httpGet: {path: /health, port: 8000}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          volumeMounts:
            - name: lake
              mountPath: /data/lake
      volumes:
        - name: lake
          persistentVolumeClaim: {claimName: lake}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: billing
spec:
  type: NodePort
  selector: {app: backend}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
