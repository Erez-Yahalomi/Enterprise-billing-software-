apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: billing
spec:
  replicas: 1
  strategy:
    type: Recreate   # single RWO volume: never run two pods against it during a rollout
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: {name: billing-secrets}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdir: the volume root has lost+found
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: billing
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
