# The `opa-policies` ConfigMap is created from policies/opa/*.rego by the start script
# (kubectl create configmap --from-file), so the rego stays the single source of truth
# shared with docker-compose and the embedded test evaluator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: billing
spec:
  replicas: 1
  selector:
    matchLabels: {app: opa}
  template:
    metadata:
      labels: {app: opa}
    spec:
      enableServiceLinks: false
      containers:
        - name: opa
          image: openpolicyagent/opa:0.68.0
          # Name the file, not the directory: a ConfigMap mount also exposes each file under a
          # hidden ..data/ timestamped dir, so loading the directory defines every rule twice.
          args: ["run", "--server", "--addr", ":8181", "/policies/ai_tools.rego"]
          ports:
            - containerPort: 8181
          readinessProbe:
            httpGet: {path: /health, port: 8181}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8181}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: policies
              mountPath: /policies
      volumes:
        - name: policies
          configMap: {name: opa-policies}
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: billing
spec:
  selector: {app: opa}
  ports:
    - port: 8181
