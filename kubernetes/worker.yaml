apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: billing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: billing-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: billing-config}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: billing-secrets, key: DATABASE_URL}}
          volumeMounts:
            - name: lake
              mountPath: /data/lake
      volumes:
        - name: lake
          persistentVolumeClaim: {claimName: lake}
